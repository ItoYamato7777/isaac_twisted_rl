# ruff の設定。呼び出しは `uvx ruff@0.16.10 check|format <ファイル>`。
# ruff は uv の環境に入れない (uv.lock と .venv を変えないため)。設定を pyproject.toml に置かないのも同じ理由
# (pyproject.toml が変わると、次の `uv run` がこのプロジェクトの editable install を作り直す)。
# 版によって既定の規則の集合が大きく変わるので、版を固定する。
required-version = "==0.16.10"
line-length = 120
target-version = "py311"
# 文書の中のコードブロックは整形しない (コメントの桁揃えが崩れる。凍結した報告書もある)。
# docs/history/ の下の道具 (リファクタリングの記録) は、結果を出したときの形のまま残す。
extend-exclude = ["*.md", "docs/history/"]

[lint]
# 最初は小さい集合にする。B008 (SceneEntityCfg を既定値に置く Isaac Lab の慣用) などは選ばない。
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["isaac_twisted_rl"]
# Isaac Lab の慣用に合わせ、isaaclab 系を他のサードパーティ (torch など) と別の塊にする。
section-order = ["future", "standard-library", "third-party", "isaaclab", "first-party", "local-folder"]

[lint.isort.sections]
isaaclab = ["isaaclab", "isaaclab_assets", "isaaclab_rl", "isaaclab_tasks"]

[lint.per-file-ignores]
# AppLauncher で Kit を起動してから isaaclab などを import するスクリプト。
# import の位置と順序に意味があるので、E402 と並べ替え (I) を当てない。
"src/isaac_twisted_rl/scripts/list_envs.py" = ["E402", "I"]
"src/isaac_twisted_rl/scripts/random_agent.py" = ["E402", "I"]
"src/isaac_twisted_rl/scripts/rsl_rl/eval_chain.py" = ["E402", "I"]
